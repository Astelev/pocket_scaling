modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Astelev/pocket_scaling/issues"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Astelev"
displayURL="https://github.com/Astelev/pocket_scaling"
description='''
аддон для мода Create: Pocket Sized уменьшающий производительность и объём уменьшенных механизмов а так же добавляющий интеграцию схематики с уменьшенными конструкциями.
'''
[[mixins]]
config="just_scale_it.mixins.json"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="[6.0.10,6.1)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="pocket"
type="required"
versionRange="[0.24.1,0.25)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="pym"
type="required"
versionRange="[0.5.1,0.6)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="required"
versionRange="[2.0.6,2.1)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aeroutils"
type="incompatible"
versionRange="[0,0.0.2)"
reason="Older AeroUtils versions contain the same scaling hooks. Use the extracted-integration build (0.0.2 or newer)."
ordering="NONE"
side="BOTH"
